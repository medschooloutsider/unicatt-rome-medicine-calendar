name: Monitor UCSC calendar publication

on:
  workflow_dispatch:
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ucsc-calendar-state
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify public feeds
        id: verify
        continue-on-error: true
        run: |
          set +e
          python3 medical_curriculum_tooling/calendar_reliability/check_public_calendar.py > sentinel-result.json
          exit_code=$?
          cat sentinel-result.json
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          stale_only="$(python3 -c 'import json,sys; failures=json.load(open(sys.argv[1], encoding="utf-8")).get("failures", []); allowed=("health.json: freshness lease expired or missing",); print("true" if failures and all((f in allowed or f.endswith(": publication age")) for f in failures) else "false")' sentinel-result.json)"
          echo "stale_only=$stale_only" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Recover stale publication and re-probe
        id: recover
        if: steps.verify.outputs.ok != 'true' && steps.verify.outputs.stale_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 medical_curriculum_tooling/calendar_reliability/publisher_supervisor.py recover \
            --repo "$GITHUB_REPOSITORY" \
            --workflow calendar-publish.yml \
            --reason sentinel-stale-publication \
            --cooldown-seconds 1800 \
            --timeout-seconds 240 > recovery-result.json
          recovery_code=$?
          cat recovery-result.json
          if [ "$recovery_code" -eq 0 ]; then
            echo "publisher_ok=true" >> "$GITHUB_OUTPUT"
            python3 medical_curriculum_tooling/calendar_reliability/check_public_calendar.py > recovery-sentinel-result.json
            probe_code=$?
            cat recovery-sentinel-result.json
            if [ "$probe_code" -eq 0 ]; then echo "final_ok=true" >> "$GITHUB_OUTPUT"; else echo "final_ok=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "publisher_ok=false" >> "$GITHUB_OUTPUT"
            echo "final_ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Determine final result
        id: final
        if: always()
        run: |
          if [ "${{ steps.verify.outputs.ok }}" = "true" ]; then
            echo "final_ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.verify.outputs.stale_only }}" = "true" ] && [ "${{ steps.recover.outputs.final_ok }}" = "true" ]; then
            echo "final_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "final_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open and notify unresolved alert
        if: steps.final.outputs.final_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CALENDAR_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.CALENDAR_ALERT_TELEGRAM_BOT_TOKEN }}
          CALENDAR_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.CALENDAR_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          set +e
          issue_number="$(gh issue list --state open --search '[Calendar Alert] UCSC publication' --json number --jq '.[0].number // empty')"
          created=0
          if [ -z "$issue_number" ]; then
            issue_url="$(gh issue create --title "[Calendar Alert] UCSC publication" --body "The independent public-feed sentinel failed after bounded retries and any eligible recovery. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and its JSON diagnostics. Keep this issue open until a successful sentinel run confirms recovery.")"
            issue_number="${issue_url##*/}"
            case "$issue_number" in
              (''|*[!0-9]*) issue_number="" ;;
              (*) created=1 ;;
            esac
          fi
          result="$(python3 -m medical_curriculum_tooling.calendar_reliability.telegram_notifier --event-type watchdog_failure --feed-id all --summary "Public calendar sentinel failed after bounded recovery" --message "Inspect GitHub issue #$issue_number and workflow run $GITHUB_RUN_ID." --fingerprint "sentinel-issue-$issue_number" --receipt alerts/telegram-delivery.json)"
          status="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')"
          if [ -n "$issue_number" ] && { [ "$created" -eq 1 ] || [ "$status" = "failed" ] || [ "$status" = "not_configured" ]; }; then gh issue comment "$issue_number" --body "Telegram delivery status: ${status}. The issue remains the durable fallback." >/dev/null; fi
          printf '%s\n' "$result"
      - name: Close durable alert issue after verified recovery
        if: steps.final.outputs.final_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CALENDAR_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.CALENDAR_ALERT_TELEGRAM_BOT_TOKEN }}
          CALENDAR_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.CALENDAR_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          set +e
          issue_number="$(gh issue list --state open --search '[Calendar Alert] UCSC publication' --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            result="$(python3 -m medical_curriculum_tooling.calendar_reliability.telegram_notifier --event-type publication_recovered --feed-id all --summary "Public calendar recovered" --message "Public feed health, freshness, hashes, and UID parity passed after bounded verification." --fingerprint "sentinel-issue-$issue_number-recovered" --receipt alerts/telegram-delivery.json)"
            status="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')"
            printf '%s\n' "$result"
            if [ "$status" = "sent" ] || [ "$status" = "duplicate" ] || [ "$status" = "not_configured" ]; then gh issue close "$issue_number" --comment "Independent sentinel recovered: public feed health, freshness, hashes, and UID parity passed after bounded recovery. Telegram delivery status: ${status}." >/dev/null; else gh issue comment "$issue_number" --body "Public feeds recovered, but Telegram recovery delivery failed; leaving this issue open for retry." >/dev/null; fi
          fi
      - name: Commit Telegram delivery receipt
        if: always()
        run: |
          git config user.name "calendar-pipeline[bot]"
          git config user.email "calendar-pipeline[bot]@users.noreply.github.com"
          git add alerts
          git diff --cached --quiet || git commit -m "Record UCSC calendar alert delivery"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "git push failed after 5 attempts" >&2
              exit 1
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              echo "git rebase failed after a concurrent main-branch update; refusing to guess through a conflict" >&2
              git rebase --abort || true
              exit 1
            fi
            delay=$((attempt * 10))
            echo "git push raced with another main update; rebased and retrying in ${delay}s (attempt $((attempt + 1))/5)" >&2
            sleep "$delay"
          done
      - name: Preserve sentinel failure state
        if: steps.final.outputs.final_ok != 'true'
        run: exit 1
