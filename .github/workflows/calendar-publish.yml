name: Publish UCSC calendar feeds

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler contention.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ucsc-calendar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run reliability tests
        run: python3 -m unittest discover -s medical_curriculum_tooling/calendar_reliability/tests -p 'test_*.py' -v
      - name: Poll, publish, and verify
        env:
          CALENDAR_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.CALENDAR_ALERT_TELEGRAM_BOT_TOKEN }}
          CALENDAR_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.CALENDAR_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          python3 -m medical_curriculum_tooling.calendar_reliability.pipeline run --root . --public public --state state --bootstrap public
          python3 -m medical_curriculum_tooling.calendar_reliability.pipeline verify --root . --public public --state state
          python3 -m medical_curriculum_tooling.calendar_reliability.pipeline watchdog --root . --public public --state state
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Commit publication, state, and health receipts
        run: |
          git config user.name "calendar-pipeline[bot]"
          git config user.email "calendar-pipeline[bot]@users.noreply.github.com"
          git add public state alerts
          git diff --cached --quiet || git commit -m "Refresh UCSC calendar feeds"
          git push
  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
